<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" /><meta name="description" content="Activa: rutinas de ejercicio personalizadas según tu tiempo, objetivo y espacio. Entrena a tu ritmo." />
  <title>ACTIVA · Entrena a tu ritmo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><rect x="3" y="13" width="4" height="8"/><rect x="10" y="8" width="4" height="13"/><rect x="17" y="3" width="4" height="18"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2c0-4.3 3.1-6 8-6s8 1.7 8 6v2z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m13 5-7 7 7 7M6 12h15"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22S5 14.6 5 10a7 7 0 1 1 14 0c0 4.6-7 12-7 12Z"/><circle cx="12" cy="10" r="2.4"/></symbol>
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M2 9h3m0-4v14m0-11h3v8H5m3-4h8m0-4h3v8h-3m3-11v14m0-10h3"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="11" cy="13" r="9"/><circle cx="11" cy="13" r="5"/><circle cx="11" cy="13" r="1"/><path d="m11 13 9-9m-3 0h3v3"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 17h4l3-8 4 11 3-7h4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m7 4 14 8-14 8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5v14m10-14v14"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h14v18l-7-5-7 5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 4 11 8-11 8zM19 4v16"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 17 0 3 3-1 13-13-3-3L4 17Zm11-12 3 3"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-2L3 9m0-6v6h6M4 16a8 8 0 0 0 14 2l3-3m0 6v-6h-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    <symbol id="i-lightning" viewBox="0 0 24 24"><path d="M13 2 5 13h7l-1 9 8-12h-7z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h1m-1 6h1m-1 6h1"/></symbol>
  </svg>

  <div class="desktop-layout">

    <div class="phone" aria-label="Aplicación Activa">
      <div class="phone-inner">
        <div class="notch" aria-hidden="true"></div>
        <div class="status-bar" aria-hidden="true"><span>9:41</span><span class="status-icons"><span class="signal-bars">▂▄▆</span><span>◕</span><span class="battery"></span></span></div>
        <main id="screen" class="phone-content" tabindex="-1" aria-live="polite"></main>
        <nav class="bottom-nav" hidden aria-label="Navegación principal">
          <button type="button" data-nav="home" class="nav-item active"><svg class="ic"><use href="#i-home" /></svg><span>Inicio</span></button>
          <button type="button" data-nav="search" class="nav-item"><svg class="ic"><use href="#i-search" /></svg><span>Buscar</span></button>
          <button type="button" data-nav="progress" class="nav-item"><svg class="ic"><use href="#i-chart" /></svg><span>Progreso</span></button>
          <button type="button" data-nav="profile" class="nav-item"><svg class="ic"><use href="#i-user" /></svg><span>Perfil</span></button>
        </nav>
      </div>
    </div>
  </div>

  <dialog id="app-modal" class="app-modal" aria-labelledby="modal-title">
    <div class="modal-wrap">
      <div class="modal-heading"><h2 id="modal-title"></h2><button type="button" id="close-modal" class="icon-button" aria-label="Cerrar"><svg class="ic"><use href="#i-close" /></svg></button></div>
      <div id="modal-content"></div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
